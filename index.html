<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖縄特産品 BtoB卸売カタログ【バイヤー専用ページ】</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #00b4d8;
            --ocean-blue: #0077b6;
            --vivid-orange: #ff7b00;
            --vivid-pink: #ff007f;
            --coral-yellow: #ffb703;
            --glass-bg: rgba(255, 255, 255, 0.90);
            --glass-card: rgba(255, 255, 255, 0.95);
            --dark-text: #023e8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', 'M PLUS Rounded 1c', sans-serif;
            color: #1e293b;
            line-height: 1.6;
            /* 鮮やかで眩しいエメラルドビーチ背景 */
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(0, 180, 216, 0.15) 100%),
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        /* -----------------------------------
           鮮やかなトロピカルヘッダー
        ----------------------------------- */
        header {
            background: linear-gradient(135deg, rgba(0, 180, 216, 0.92), rgba(0, 119, 182, 0.95));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0, 180, 216, 0.3);
            border-bottom: 3px solid var(--coral-yellow);
        }

        .header-brand h1 {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: linear-gradient(135deg, var(--vivid-orange), var(--vivid-pink));
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(255, 0, 127, 0.3);
            border: 2px solid #ffffff;
        }

        /* -----------------------------------
           メインコンテナ
        ----------------------------------- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }

        /* 明るいヒーローセクション */
        .hero-banner {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            margin-bottom: 2.5rem;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0, 180, 216, 0.15);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ff007f, #ff7b00, #ffb703, #00b4d8);
        }

        .hero-banner h2 {
            font-size: 1.9rem;
            color: var(--dark-text);
            margin-bottom: 0.8rem;
            font-weight: 900;
            line-height: 1.4;
        }

        .hero-banner p {
            color: #334155;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 検索バー */
        .search-container {
            margin-top: 1.8rem;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 480px;
            padding: 14px 24px;
            border-radius: 30px;
            border: 2px solid var(--primary-blue);
            outline: none;
            font-size: 1rem;
            font-weight: 500;
            background: #ffffff;
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.15);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--vivid-pink);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.25);
            transform: translateY(-2px);
        }

        /* -----------------------------------
           商品グリッドレイアウト
        ----------------------------------- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* ポップ＆鮮やかな商品カード */
        .product-card {
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 22px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 30px rgba(0, 119, 182, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 180, 216, 0.25);
            border-color: var(--primary-blue);
        }

        /* 商品画像エリア */
        .product-image-wrap {
            position: relative;
            width: 100%;
            height: 230px;
            overflow: hidden;
            background-color: #e2e8f0;
        }

        .product-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.08);
        }

        .category-tag {
            position: absolute;
            top: 14px;
            left: 14px;
            background: linear-gradient(135deg, var(--vivid-orange), var(--coral-yellow));
            color: #ffffff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* 商品情報エリア */
        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--dark-text);
            margin-bottom: 1rem;
            line-height: 1.4;
            min-height: 2.8em;
        }

        .product-details {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 16px;
            padding: 1.1rem;
            margin-bottom: 1.2rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            color: #0369a1;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .detail-value {
            font-weight: 700;
            color: #0f172a;
        }

        .price-value {
            color: var(--vivid-pink);
            font-size: 1.45rem;
            font-weight: 900;
        }

        .price-unit {
            font-size: 0.8rem;
            color: #64748b;
            margin-left: 2px;
        }

        /* トロピカルアクションボタン */
        .action-button {
            margin-top: auto;
            width: 100%;
            background: linear-gradient(135deg, var(--vivid-orange), #ff5e62);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 18px rgba(255, 123, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-button:hover {
            background: linear-gradient(135deg, #ff5e62, var(--vivid-pink));
            box-shadow: 0 8px 22px rgba(255, 0, 127, 0.4);
            transform: translateY(-2px);
        }

        /* ステータス表示 */
        .no-products, .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            color: #0369a1;
            font-size: 1.15rem;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 180, 216, 0.1);
        }

        .loading-spinner {
            display: inline-block;
            width: 44px;
            height: 44px;
            border: 5px solid rgba(0, 180, 216, 0.2);
            border-radius: 50%;
            border-top-color: var(--vivid-orange);
            animation: spin 0.8s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* -----------------------------------
           フッター
        ----------------------------------- */
        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            background: linear-gradient(135deg, var(--ocean-blue), #03045e);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            font-weight: 500;
            border-top: 4px solid var(--coral-yellow);
        }

        /* レスポンシブ調整 */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            .hero-banner {
                padding: 1.8rem 1.2rem;
            }
            .hero-banner h2 {
                font-size: 1.45rem;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="header-brand">
            <h1>🌺 沖縄特産品 BtoB卸売ポータル</h1>
        </div>
        <div class="badge">☀️ バイヤー専用カタログ</div>
    </header>

    <!-- メインコンテンツ -->
    <div class="container">
        <!-- ヒーローセクション -->
        <div class="hero-banner">
            <h2>✨ 太陽と美ら海が育んだ最高品質を、沖縄から直接お届け！</h2>
            <p>厳選された旬の特産品を取り揃えた卸売専用ポータルです。<br>卸価格や最低ロット（MOQ）をご確認のうえ、お気軽にお問い合わせください。</p>
            
            <!-- 検索バー -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 商品名でキーワード検索..." onkeyup="filterProducts()">
            </div>
        </div>

        <!-- 商品リスト出力エリア -->
        <div class="product-grid" id="catalogGrid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>最新の卸売カタログを読み込み中...</div>
            </div>
        </div>
    </div>

    <!-- フッター -->
    <footer>
        <p>&copy; ON SIGHT OKINAWA All Rights Reserved.</p>
    </footer>

    <script>
        // Google Apps Script (GAS) WebアプリのURL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzHc_cxANoYwx1rfN7oigzrtwtAcghMzUbulNWCbFe7wq2qMN6kgLOnhqUKI9aCdS0y/exec";

        let allProducts = []; // 取得した商品を保持

        function loadProducts() {
            const grid = document.getElementById('catalogGrid');
            
            // スプレッドシートからのデータ読み込み
            fetch(GAS_URL)
                .then(response => response.json())
                .then(products => {
                    allProducts = products;
                    renderProducts(allProducts);
                })
                .catch(err => {
                    console.error('Error:', err);
                    grid.innerHTML = `
                        <div class="no-products">
                            <p style="color: #ff007f; font-weight: bold; margin-bottom: 8px;">データの読み込みに失敗しました。</p>
                            <p style="font-size: 0.9rem;">GASのURL設定や接続をご確認ください。</p>
                        </div>`;
                });
        }

        // 商品一覧を描画する関数
        function renderProducts(products) {
            const grid = document.getElementById('catalogGrid');
            
            if (!products || products.length === 0) {
                grid.innerHTML = '<div class="no-products">現在、該当する取扱商品はございません。</div>';
                return;
            }
            
            grid.innerHTML = ''; // クリア

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                // 画像URLが空の場合のフォールバック
                const imageUrl = product.image || 'https://images.unsplash.com/photo-1534482421-64566f976cfa?auto=format&fit=crop&w=600&q=80';
                
                card.innerHTML = `
                    <div class="product-image-wrap">
                        <div class="product-image" style="background-image: url('${imageUrl}');"></div>
                        <span class="category-tag">🌴 沖縄直送</span>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        
                        <div class="product-details">
                            <div class="detail-row">
                                <span class="detail-label">卸価格 (税別)</span>
                                <span class="detail-value">
                                    <span class="price-value">￥${Number(product.price).toLocaleString()}</span>
                                    <span class="price-unit">/ 単位</span>
                                </span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">最低ロット (MOQ)</span>
                                <span class="detail-value">${product.lot}</span>
                            </div>
                        </div>

                        <button class="action-button" onclick="alert('${product.name} のサンプル・お見積もり依頼を送信します。')">
                            📦 サンプル・見積りを依頼
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 検索フィルター機能
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // ページ読み込み時に実行
        window.onload = loadProducts;
    </script>
</body>
</html>
