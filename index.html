<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖縄特産品 BtoB卸売カタログ</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #008da5;
            --ocean-blue: #0077b6;
            --dark-text: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.88);
            --glass-card: rgba(255, 255, 255, 0.94);
            --glass-border: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            color: #1e293b;
            line-height: 1.6;
            /* 明るく透明感のあるトロピカルビーチ写真 */
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=90') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        /* -----------------------------------
           ヘッダー
        ----------------------------------- */
        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--dark-text);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-bottom: 2px solid rgba(0, 141, 165, 0.2);
        }

        .header-brand h1 {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            color: var(--ocean-blue);
        }

        /* -----------------------------------
           メインコンテナ
        ----------------------------------- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }

        /* ヒーローセクション */
        .hero-banner {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            margin-bottom: 2.5rem;
            border: 2px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 119, 182, 0.1);
            text-align: center;
        }

        .hero-banner h2 {
            font-size: 1.8rem;
            color: var(--ocean-blue);
            margin-bottom: 0.8rem;
            font-weight: 900;
            line-height: 1.4;
        }

        .hero-banner p {
            color: #334155;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 検索バー */
        .search-container {
            margin-top: 1.8rem;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 480px;
            padding: 12px 22px;
            border-radius: 30px;
            border: 2px solid var(--primary-blue);
            outline: none;
            font-size: 0.95rem;
            font-weight: 500;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--ocean-blue);
            box-shadow: 0 6px 20px rgba(0, 119, 182, 0.2);
            transform: translateY(-1px);
        }

        /* -----------------------------------
           商品グリッドレイアウト
        ----------------------------------- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* 商品カード */
        .product-card {
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 35px rgba(0, 119, 182, 0.18);
            border-color: var(--primary-blue);
        }

        /* 商品画像エリア */
        .product-image-wrap {
            position: relative;
            width: 100%;
            height: 230px;
            overflow: hidden;
            background-color: #e2e8f0;
        }

        .product-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.06);
        }

        .category-tag {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0, 119, 182, 0.85);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        /* 商品情報エリア */
        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--dark-text);
            margin-bottom: 1.5rem;
            line-height: 1.4;
            min-height: 2.8em;
        }

        /* アクションボタン */
        .action-button {
            margin-top: auto;
            width: 100%;
            background: linear-gradient(135deg, #008da5, #0077b6);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(0, 141, 165, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-button:hover {
            opacity: 0.95;
            box-shadow: 0 6px 18px rgba(0, 119, 182, 0.35);
            transform: translateY(-2px);
        }

        /* ステータス表示 */
        .no-products, .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            color: #0369a1;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 141, 165, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary-blue);
            animation: spin 0.8s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* -----------------------------------
           フッター
        ----------------------------------- */
        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            color: #475569;
            font-size: 0.85rem;
            font-weight: 500;
            border-top: 1px solid rgba(0, 141, 165, 0.15);
        }

        /* レスポンシブ調整 */
        @media (max-width: 768px) {
            header {
                text-align: center;
                justify-content: center;
            }
            .hero-banner {
                padding: 1.8rem 1.2rem;
            }
            .hero-banner h2 {
                font-size: 1.45rem;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="header-brand">
            <h1>沖縄特産品 BtoB卸売ポータル</h1>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <div class="container">
        <!-- ヒーローセクション -->
        <div class="hero-banner">
            <h2>日本の旬を、沖縄から直接お届け</h2>
            <p>沖縄の自然と素材を活かした厳選特産品の卸売専用カタログです。<br>詳細やご不明点は下記ボタンよりお気軽にお問い合わせください。</p>
            
            <!-- 検索バー -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="商品名で検索..." onkeyup="filterProducts()">
            </div>
        </div>

        <!-- 商品リスト出力エリア -->
        <div class="product-grid" id="catalogGrid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>最新の卸売カタログを読み込み中...</div>
            </div>
        </div>
    </div>

    <!-- フッター -->
    <footer>
        <p>&copy; ON SIGHT OKINAWA All Rights Reserved.</p>
    </footer>

    <script>
        // Google Apps Script (GAS) WebアプリのURL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzHc_cxANoYwx1rfN7oigzrtwtAcghMzUbulNWCbFe7wq2qMN6kgLOnhqUKI9aCdS0y/exec";

        let allProducts = []; // 取得した商品を保持

        function loadProducts() {
            const grid = document.getElementById('catalogGrid');
            
            // スプレッドシートからのデータ読み込み
            fetch(GAS_URL)
                .then(response => response.json())
                .then(products => {
                    allProducts = products;
                    renderProducts(allProducts);
                })
                .catch(err => {
                    console.error('Error:', err);
                    grid.innerHTML = `
                        <div class="no-products">
                            <p style="color: #d97706; font-weight: bold; margin-bottom: 8px;">データの読み込みに失敗しました。</p>
                            <p style="font-size: 0.9rem;">GASのURL設定や接続をご確認ください。</p>
                        </div>`;
                });
        }

        // 商品一覧を描画する関数
        function renderProducts(products) {
            const grid = document.getElementById('catalogGrid');
            
            if (!products || products.length === 0) {
                grid.innerHTML = '<div class="no-products">現在、該当する取扱商品はございません。</div>';
                return;
            }
            
            grid.innerHTML = ''; // クリア

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                // 画像URLが空の場合のフォールバック
                const imageUrl = product.image || 'https://images.unsplash.com/photo-1534482421-64566f976cfa?auto=format&fit=crop&w=600&q=80';
                
                card.innerHTML = `
                    <div class="product-image-wrap">
                        <div class="product-image" style="background-image: url('${imageUrl}');"></div>
                        <span class="category-tag">沖縄直送</span>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>

                        <button class="action-button" onclick="alert('${product.name} のサンプル・お見積もり依頼を送信します。')">
                            サンプル・見積りを依頼
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 検索フィルター機能
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // ページ読み込み時に実行
        window.onload = loadProducts;
    </script>
</body>
</html>
